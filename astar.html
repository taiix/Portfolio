<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="src/style/appStyle.css"/>
    <link rel="stylesheet" href="src/style/backButton.css"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A* Pathfinding</title>
    <style>
      :root { --page-max: 1100px; }
      body { color: #f0eeef; }
      .project-page { box-sizing: border-box; max-width: var(--page-max); margin: 100px auto 60px; padding: 0 20px 40px; }
      .project-hero h1 { font-size: clamp(2rem, 3vw, 3rem); margin: 0 0 12px; }
      .project-hero p { font-size: 1.05rem; line-height: 1.6; opacity: 0.95; margin: 0 0 24px; }
      .project-media { display: grid; gap: 20px; }
      .project-video { width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 4px 30px rgba(0,0,0,0.2); }
      .project-video video, .project-video iframe { width: 100%; height: 100%; display: block; }
      .project-gallery { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
      .project-gallery img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); }
      .span-12 { grid-column: span 12; } .span-6 { grid-column: span 6; } .span-4 { grid-column: span 4; }
      @media (max-width: 900px) { .span-6 { grid-column: span 12; } .span-4 { grid-column: span 6; } }
      @media (max-width: 600px) { .span-4 { grid-column: span 12; } }
    </style>
  </head>
  <body>
    <div class="container"></div>
    <script>
      fetch('/backButton.html')
        .then(res => res.text())
        .then(html => { const c = document.createElement('div'); c.innerHTML = html; document.body.appendChild(c); })
        .catch(() => { const a = document.createElement('a'); a.href='/index.html'; a.textContent='← Back'; a.style.cssText='position:fixed;top:20px;left:20px;color:#f0eeef;text-decoration:none;'; document.body.appendChild(a); });
    </script>
    <main class="project-page" role="main">
      <section class="project-hero" aria-labelledby="project-title">
        <h1 id="project-title">A* Pathfinding</h1>
        <p>
          An interactive A* visualizer demonstrating open/closed sets, heuristic costs,
          and shortest-path reconstruction on grids and weighted graphs. Includes toggles
          for heuristics and diagonal movement.
        </p>
      </section>
      <section class="project-media" aria-label="Project media">
        <div class="project-video" aria-label="Demo video">
          <video controls preload="metadata" poster="/assets/astarImage.png">
            <source src="/assets/astar.mp4" type="video/mp4" />
            Your browser does not support the video tag.
          </video>
        </div>
        <div class="project-gallery" aria-label="Image gallery">
          <img class="span-12" src="/assets/astarImage.png" alt="A* grid overview" loading="lazy" />
          <img class="span-6"  src="/assets/astar-1.png" alt="Heuristic visualization" loading="lazy" />
          <img class="span-6"  src="/assets/astar-2.png" alt="Visited nodes" loading="lazy" />
          <img class="span-4"  src="/assets/astar-3.png" alt="Weighted terrain" loading="lazy" />
          <img class="span-4"  src="/assets/astar-4.png" alt="Diagonal movement" loading="lazy" />
          <img class="span-4"  src="/assets/astar-5.png" alt="Path reconstruction" loading="lazy" />
        </div>
      </section>
    </main>
  </body>
</html>
